---
bind_acls:
  - match_list:
      - 10.11.0.0/16
    name: acl1
bind_allow_query:
  - any
bind_check_names: master ignore
bind_dns64: true
bind_forwarders:
  - 8.8.8.8
  - 8.8.4.4
bind_listen_ipv4:
  - any
bind_listen_ipv6:
  - any
bind_query_log: data/query.log
bind_recursion: true
bind_statistics_allow:
  - any
bind_statistics_channels: true
# A static value, not a live fact: ansible_facts['default_ipv4'] isn't
# reliably populated at gather-facts time, so this fell back to 127.0.0.1
# on the first converge but resolved to the container's real (and
# unpredictable) docker0 address on the second - breaking idempotence.
bind_statistics_host: "127.0.0.1"
bind_zone_dir: /var/local/named-zones
bind_zone_file_mode: "0660"
bind_zone_minimum_ttl: 2D
bind_zone_time_to_expire: 2W
bind_zone_time_to_refresh: 2D
bind_zone_time_to_retry: 2H
bind_zone_ttl: 2W
# Moved here from molecule/default/host_vars/ns1.yml: those host_vars keyed
# on ns1/ns2/ns3 never applied to any host - the single molecule instance is
# actually named "bind-${image}-${tag}", so Ansible silently skipped them and
# bind_zones fell back to the role's `[]` default (verify.yml's dig lookups
# then failed outright against an empty zone).
bind_zones:
  - hostmaster_email: admin
    hosts:
      - aliases:
          - www
        ip: 192.0.2.1
        ipv6: 2001:db9::1
        name: srv001
      - ip: 192.0.2.2
        ipv6: 2001:db9::2
        name: srv002
      - ip: 192.0.2.10
        ipv6: 2001:db9::3
        name: mail001
    ipv6_networks:
      - 2001:db9::/48
    mail_servers:
      - name: mail001
        preference: 10
    name: example.com
    name_servers:
      - ns1.acme-inc.com.
      - ns2.acme-inc.com.
    networks:
      - 192.0.2
    primaries:
      - 10.11.0.1
    type: primary
  - hosts:
      - ip: 10.11.0.1
        name: ns1
      - ip: 10.11.0.2
        name: ns2
      - aliases:
          - www
        ip: 10.11.1.1
        ipv6: 2001:db8::1
        name: srv001
      - aliases:
          - mysql
        ip: 10.11.1.2
        ipv6: 2001:db8::2
        name: srv002
      - aliases:
          - smtp
          - mail-in
        ip: 10.11.2.1
        ipv6: 2001:db8::d:1
        name: mail001
      - ip: 10.11.2.2
        ipv6: 2001:db8::d:2
        name: mail002
      - aliases:
          - imap
          - mail-out
        ip: 10.11.2.3
        ipv6: 2001:db8::d:3
        name: mail003
      - ip: 10.11.0.10
        name: srv010
      - ip: 10.11.0.11
        name: srv011
      - ip: 10.11.0.12
        name: srv012
    ipv6_networks:
      - 2001:db8::/48
    mail_servers:
      - name: mail001
        preference: 10
      - name: mail002
        preference: 20
    name: acme-inc.com
    name_servers:
      - ns1
      - ns2
    networks:
      - "10.11"
    primaries:
      - 10.11.0.1
    services:
      - name: _ldap._tcp
        port: 88
        target: srv010
        weight: 100
    text:
      - name: _kerberos
        text: KERBEROS.ACME-INC.COM
      - name: "@"
        text:
          - some text
          - more text
    type: primary
