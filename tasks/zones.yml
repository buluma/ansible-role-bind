---
- name: zones | Set list of all host IP addresses
  ansible.builtin.set_fact:
    host_all_addresses: "{{ ansible_all_ipv4_addresses | union(ansible_all_ipv6_addresses) }}"
  tags: bind
- name: zones | Read forward zone hashes
  ansible.builtin.shell: grep -s "^; Hash:" {{ bind_zone_dir }}/{{ item.name }} || true
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.name }}"
  register: forward_hashes_temp
  run_once: true
  tags: bind
  with_items:
    - "{{ bind_zones }}"
- name: zones | Create dict of forward hashes
  ansible.builtin.set_fact:
    forward_hashes: "{{ forward_hashes | default([]) + [{'hash': item.stdout | default(), 'name': item.item.name}] }}"
  loop_control:
    label: "{{ item.item.name }}"
  run_once: true
  tags: bind
  with_items:
    - "{{ forward_hashes_temp.results }}"
- name: zones | Read reverse ipv4 zone hashes
  ansible.builtin.shell: grep -s "^; Hash:" {{ bind_zone_dir }}/{{ ('.'.join(item.1.replace(item.1+'.','').split('.')[::-1])) }}.in-addr.arpa || true
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.1 }}"
  register: reverse_hashes_temp
  run_once: true
  tags: bind
  with_subelements:
    - "{{ bind_zones }}"
    - networks
    - flags:
      skip_missing: true
- name: zones | Create dict of reverse hashes
  ansible.builtin.set_fact:
    reverse_hashes: "{{ reverse_hashes|default([]) + [ {'hash': item.0.stdout|default(), 'network': item.1} ] }}"
  loop_control:
    label: "{{ item.1.name | default(item.0.cmd.split(' ')[4]) }}"
  run_once: true
  tags: bind
  with_subelements:
    - "{{ reverse_hashes_temp.results }}"
    - item
- name: zones | Read reverse ipv6 zone hashes
  ansible.builtin.shell: grep -s "^; Hash:" {{ bind_zone_dir }}/{{ (item.1 | ipaddr('revdns'))[-(9+(item.1|regex_replace('^.*/','')|int)//2):-1] }} || true
  changed_when: false
  check_mode: false
  loop_control:
    label: "{{ item.1 }}"
  register: reverse_hashes_ipv6_temp
  run_once: true
  tags: bind
  with_subelements:
    - "{{ bind_zones }}"
    - ipv6_networks
    - flags:
      skip_missing: true
- name: zones | Create dict of reverse ipv6 hashes
  ansible.builtin.set_fact:
    reverse_hashes_ipv6: "{{ reverse_hashes_ipv6|default([]) + [ {'hash': item.0.stdout|default(), 'network': item.1} ] }}"
  loop_control:
    label: "{{ item.1.name |default(item.0.cmd.split(' ')[4]) }}"
  run_once: true
  tags: bind
  with_subelements:
    - "{{ reverse_hashes_ipv6_temp.results }}"
    - item
- name: zones | Create forward lookup zone file
  ansible.builtin.template:
    dest: "{{ bind_zone_dir }}/{{ item.name }}"
    group: "{{ bind_group }}"
    mode: "{{ bind_zone_file_mode }}"
    owner: "{{ bind_owner }}"
    setype: named_zone_t
    src: bind_zone.j2
    validate: named-checkzone -d {{ item.name }} %s
  become: true
  loop_control:
    label: "{{ item.name }}"
  notify: Reload bind
  tags: bind
  when: "(item.create_forward_zones is not defined or item.create_forward_zones) and (\n  (item.type is defined and item.type == 'primary') or\n  (item.type is not
    defined and item.primaries is defined and\n  (host_all_addresses | intersect(item.primaries) | length > 0))\n)\n"
  with_items:
    - "{{ bind_zones }}"
- name: zones | Create reverse lookup zone file
  ansible.builtin.template:
    dest: "{{ bind_zone_dir }}/{{ ('.'.join(item.1.replace(item.1+'.','').split('.')[::-1])) }}.in-addr.arpa"
    group: "{{ bind_group }}"
    mode: "{{ bind_zone_file_mode }}"
    owner: "{{ bind_owner }}"
    setype: named_zone_t
    src: reverse_zone.j2
    validate: named-checkzone {{ ('.'.join(item.1.replace(item.1+'.','').split('.')[::-1])) }}.in-addr.arpa %s
  become: true
  loop_control:
    label: "{{ item.1 }}"
  notify: Reload bind
  tags: bind
  when: "(item.create_reverse_zones is not defined or item.create_reverse_zones) and ((item[0].type is defined and item[0].type == 'primary') or (item[0].type is
    not defined and item[0].primaries is defined and (host_all_addresses | intersect(item[0].primaries) | length > 0)))\n"
  with_subelements:
    - "{{ bind_zones }}"
    - networks
    - flags:
      skip_missing: true
- name: zones | Create reverse IPv6 lookup zone file
  ansible.builtin.template:
    dest: "{{ bind_zone_dir }}/{{ (item.1 | ipaddr('revdns'))[-(9+(item.1|regex_replace('^.*/','')|int)//2):-1] }}"
    group: "{{ bind_group }}"
    mode: "{{ bind_zone_file_mode }}"
    owner: "{{ bind_owner }}"
    setype: named_zone_t
    src: reverse_zone_ipv6.j2
    validate: named-checkzone {{ (item.1 | ipaddr('revdns'))[-(9+(item.1|regex_replace('^.*/','')|int)//2):] }} %s
  become: true
  loop_control:
    label: "{{ item.1 }}"
  notify: Reload bind
  tags: bind
  when: "(item.create_reverse_zones is not defined or item.create_reverse_zones) and ((item[0].type is defined and item[0].type == 'primary') or (item[0].type is
    not defined and item[0].primaries is defined and (host_all_addresses | intersect(item[0].primaries) | length > 0)))\n"
  with_subelements:
    - "{{ bind_zones }}"
    - ipv6_networks
    - flags:
      skip_missing: true
